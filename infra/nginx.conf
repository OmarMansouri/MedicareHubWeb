server {
    listen 80;
    server_name 172.31.250.86;  

    # Dossier du build React (déployé par Jenkins)
    root /home/medicare/medicareapp/frontend;
    index index.html;

    # Routes frontend (React)
    location / {
        try_files $uri /index.html;
    }

    # Proxy des APIs vers le backend Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;  
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
